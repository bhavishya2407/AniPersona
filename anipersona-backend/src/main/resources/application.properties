spring.application.name=anipersona-backend
server.port=${SERVER_PORT:8081}
spring.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.auto-index-creation=true
spring.mongodb.connect-timeout=3s
spring.mongodb.socket-timeout=5s
anipersona.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
anipersona.ollama.model=${OLLAMA_MODEL:llama3.2}
anipersona.ollama.connect-timeout-seconds=${OLLAMA_CONNECT_TIMEOUT_SECONDS:10}
anipersona.ollama.request-timeout-seconds=${OLLAMA_REQUEST_TIMEOUT_SECONDS:90}
anipersona.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}
anipersona.openrouter.api-key=${OPENROUTER_API_KEY:}
anipersona.openrouter.model=${OPENROUTER_MODEL:}
anipersona.openrouter.request-timeout-seconds=${OPENROUTER_REQUEST_TIMEOUT_SECONDS:60}
